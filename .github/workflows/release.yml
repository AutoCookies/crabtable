name: 🍰 Release

on:
    push:
        tags:
            - 'v*.*.*'
            - 'v*.*.*-alpha.*'
            - 'v*.*.*-beta.*'
            - 'v*.*.*-rc.*'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: write

jobs:
    prepare:
        runs-on: ubuntu-latest

        outputs:
            release_type: ${{ steps.release-type.outputs.value }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GH_TOKEN }}

            - name: Setup Node.js
              uses: ./.github/actions/setup-node

            - name: 🚚 Get release type
              id: release-type
              run: |
                  if [[ ${{ github.ref_name }} =~ -(alpha|beta|rc)\. ]]; then
                      extracted_type="${BASH_REMATCH[1]}"
                      echo "value=$extracted_type" >> $GITHUB_OUTPUT
                  else
                      echo "value=stable" >> $GITHUB_OUTPUT
                  fi

    release-npm:
        needs: [prepare]
        if: github.repository == 'AutoCookies/crabtable'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.ref_name }}

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24.3.0
                  registry-url: https://registry.npmjs.org
                  cache: yarn

            - name: 🚚 Install dependencies and build
              run: |
                  yarn install --frozen-lockfile
                  yarn build

            - name: 🐙 Publish
              run: |
                  if [[ ${{ needs.prepare.outputs.release_type }} == "stable" ]]; then
                      yarn run publish:all --access public
                  else
                      yarn run publish:all --access public --tag ${{ needs.prepare.outputs.release_type }}
                  fi
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    build-demo:
        runs-on: ubuntu-latest
        needs: [release-npm]

        outputs:
            preview-url: ${{ steps.vercel-demo.outputs.preview-url }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: ./.github/actions/setup-node

            #  ================= Deploy Demo =================
            - name: 📦 Build demo
              run: yarn build:demo

            - name: Copy demo to workspace
              run: |
                  mkdir .workspace
                  cp -r ./examples/local/* .workspace

            - name: 🚀 Deploy to Vercel (demo)
              uses: amondnet/vercel-action@v25
              id: vercel-demo
              with:
                  vercel-token: ${{ secrets.VERCEL_TOKEN }}
                  vercel-org-id: ${{ secrets.ORG_ID }}
                  vercel-project-id: ${{ secrets.PROJECT_ID }}

    build-storybook:
        runs-on: ubuntu-latest
        needs: [release-npm]

        outputs:
            preview-url: ${{ steps.vercel-storybook.outputs.preview-url }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: ./.github/actions/setup-node

            # ================= Deploy Storybook =================
            - name: 📦 Build storybook
              run: yarn storybook:build

            - name: 🚀 Deploy to Vercel (storybook)
              uses: amondnet/vercel-action@v25
              id: vercel-storybook
              with:
                  vercel-token: ${{ secrets.VERCEL_TOKEN }}
                  vercel-org-id: ${{ secrets.ORG_ID }}
                  vercel-project-id: ${{ secrets.PROJECT_ID_STORYBOOK }}
                  vercel-args: --prod
