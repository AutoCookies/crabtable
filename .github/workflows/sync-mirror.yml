name: 🔮 Sync Mirror

on:
    push:
        branches:
            - main
            - dev

jobs:
    sync:
        if: github.repository == 'AutoCookies/crabtable'
        runs-on: ubuntu-latest
        steps:
            - name: Sync Gitee
              uses: jikkai/sync-gitee@main
              with:
                  repository: AutoCookies/crabtable
                  username: ${{ secrets.GITEE_USERNAME }}
                  password: ${{ secrets.GITEE_PASSWORD }}
                  tags: true
                  branches: main dev
